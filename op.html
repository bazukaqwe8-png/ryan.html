  --tw-shadow-colored: 0 4px 6px -1px var(--tw-shadow-color), 0 2px 4px -2px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-sm{
  --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur{
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root {
  --orange: #FF6B00;
  --orange-soft: #FFF1E6;
  --orange-deep: #E85A00;
  --blue: #1A3A8F;
  --blue-soft: #EAF0FF;
  --blue-deep: #122A6B;
  --ink: #17233F;
  --muted: #5B6885;
  --surface: #FFFDF8;
  --card: #FFFFFF;
  --line: #FFE3CC;
  --sun: #FFC531;
  --mint: #2EC4A6;
  --pink: #FF6FAE;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #111A33;
    --card: #1B2850;
    --ink: #F5F7FF;
    --muted: #B9C4E6;
    --line: #36477E;
    --orange-soft: #3A240F;
    --blue-soft: #23376E;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
}

h1, h2, h3, .display {
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
}

::-moz-selection {
  background: #FFC531;
  color: #1A3A8F;
}

::selection {
  background: #FFC531;
  color: #1A3A8F;
}

.dot-grid {
  background-image: radial-gradient(rgba(255,107,0,.18) 2px, transparent 2px);
  background-size: 22px 22px;
}

.wave {
  border-radius: 999px 999px 28px 28px;
}

.card-shadow {
  box-shadow: 0 12px 30px rgba(26,58,143,.10);
}

.card-shadow-orange {
  box-shadow: 0 12px 28px rgba(255,107,0,.18);
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.hover\:-translate-y-1:hover{
  --tw-translate-y: -0.25rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:bg-\[\#122A6B\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(18 42 107 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#E85A00\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(232 90 0 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#EAF0FF\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(234 240 255 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[var\(--blue-soft\)\]:hover{
  background-color: var(--blue-soft);
}

.hover\:bg-blue-50:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(239 246 255 / var(--tw-bg-opacity, 1));
}

.hover\:text-\[\#1A3A8F\]:hover{
  --tw-text-opacity: 1;
  color: rgb(26 58 143 / var(--tw-text-opacity, 1));
}

.hover\:shadow-lg:hover{
  --tw-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 10px 15px -3px var(--tw-shadow-color), 0 4px 6px -4px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

@media (min-width: 640px){
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:p-9{
    padding: 2.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-left{
    text-align: left;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:flex{
    display: flex;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.05fr_0\.95fr\]{
    grid-template-columns: 1.05fr 0.95fr;
  }

  .lg\:grid-cols-\[1\.1fr_0\.9fr\]{
    grid-template-columns: 1.1fr 0.9fr;
  }

  .lg\:items-center{
    align-items: center;
  }

  .lg\:gap-12{
    gap: 3rem;
  }

  .lg\:pt-10{
    padding-top: 2.5rem;
  }
}
